<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Arman Seyri</title>
  <desc id="desc">Software Engineer. Networking, backend, systems and reverse engineering.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .flow { fill: none; stroke: url(#accentLine); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1.5 22.5; animation: flow linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out infinite; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(3.4); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse, .cursor { animation: none; } .pulse { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#121a25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentLine" gradientUnits="userSpaceOnUse" x1="800" y1="0" x2="1170" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="985" cy="150" r="330">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.18"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="690" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>

